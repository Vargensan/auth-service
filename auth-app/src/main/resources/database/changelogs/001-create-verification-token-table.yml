databaseChangeLog:
  - changeSet:
      id: 001-create-verification-token-table
      author: you
      changes:
        - createTable:
            tableName: verification_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: activation_token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: verification_token
            columnNames: activation_token
            constraintName: uq_verification_token_token